apiVersion: rigging.wheelhouse.app/v1
kind: Pack
metadata: { name: external-secrets, version: 1.0.0, description: "External Secrets: sync state and stores", author: Wheelhouse, homepage: "https://external-secrets.io" }
sidebar:
  - { apiGroup: external-secrets.io, title: "External Secrets", kinds: [ExternalSecret, SecretStore, ClusterSecretStore, ClusterExternalSecret] }
views:
  - id: externalsecrets
    title: External Secrets
    symbol: "key.icloud"
    match: { group: external-secrets.io, kind: ExternalSecret }
    fields:
      - { name: target, path: ".spec.target.name" }
    columns:
      - { name: Store, path: ".spec.secretStoreRef.name" }
      - { name: Target, path: ".spec.target.name" }
      - { name: Refresh, path: ".spec.refreshInterval" }
      - { name: Synced, path: ".status.refreshTime", format: age }
      - { name: Ready, path: ".status.conditions[?(@.type=='Ready')].status" }
    status:
      - { when: { condition: Ready, status: "False" }, tone: critical, label: "Sync failing" }
      - { when: { condition: Ready, status: "True" }, tone: healthy }
    related:
      - { kind: Secret, nameFrom: ".spec.target.name", label: "Target secret" }
      - { kind: SecretStore, group: external-secrets.io, nameFrom: ".spec.secretStoreRef.name", label: "Store" }
  - id: secretstores
    title: Secret Stores
    match: { group: external-secrets.io, kind: SecretStore }
    columns:
      - { name: Ready, path: ".status.conditions[?(@.type=='Ready')].status" }
      - { name: Age, path: ".metadata.creationTimestamp", format: age }
    status:
      - { when: { condition: Ready, status: "False" }, tone: critical }
      - { when: { condition: Ready, status: "True" }, tone: healthy }
  - id: clustersecretstores
    title: Cluster Secret Stores
    match: { group: external-secrets.io, kind: ClusterSecretStore }
    columns:
      - { name: Ready, path: ".status.conditions[?(@.type=='Ready')].status" }
      - { name: Age, path: ".metadata.creationTimestamp", format: age }
    status:
      - { when: { condition: Ready, status: "False" }, tone: critical }
      - { when: { condition: Ready, status: "True" }, tone: healthy }
commands:
  - title: "Show external secret"
    for: { group: external-secrets.io, kind: ExternalSecret }
    terminal: "kubectl describe externalsecret {{name}} -n {{namespace}}"
  - title: "Show events for external secret"
    for: { group: external-secrets.io, kind: ExternalSecret }
    terminal: "kubectl get events -n {{namespace}} --field-selector involvedObject.name={{name}}"
healthRules:
  - for: { group: external-secrets.io, kind: ExternalSecret }
    when: { condition: Ready, status: "False", for: 15m }
    tone: warning
    message: "ExternalSecret {{name}} is not syncing"
  - for: { group: external-secrets.io, kind: ClusterSecretStore }
    when: { condition: Ready, status: "False", for: 10m }
    tone: critical
    message: "ClusterSecretStore {{name}} is not ready"
