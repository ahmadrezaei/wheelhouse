apiVersion: v1
kind: Config
clusters:
- name: edge-aks
  cluster:
    server: https://edge-dns-1.hcp.westeurope.azmk8s.io:443
    certificate-authority-data: QVpVUkUtQ0E=
users:
- name: clusterUser_rg-edge_edge-aks
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: kubelogin
      args: [get-token, --login, azurecli]
contexts:
- name: edge-aks
  context: {cluster: edge-aks, user: clusterUser_rg-edge_edge-aks}
current-context: edge-aks
