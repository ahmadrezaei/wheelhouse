name: Wheelhouse
options:
  bundleIdPrefix: com.ahmadrezaei
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: JCZY58QP3L
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "5"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  WheelhouseKit:
    path: Packages/WheelhouseKit
  # SwiftTerm 1.99.2 is intentionally NOT linked yet: it ships a SwiftPM build-tool plugin
  # ("SwiftTermBuildInfoPlugin") that Xcode must be told to trust once (Xcode GUI "Trust & Enable", or
  # xcodebuild -skipPackagePluginValidation). Uncomment the three SwiftTerm blocks after the owner of the
  # Sessions feature has approved that.
  # SwiftTerm:
  #   url: https://github.com/migueldeicaza/SwiftTerm
  #   exactVersion: 1.99.2
targets:
  Wheelhouse:
    type: application
    platform: iOS
    sources:
      - path: Wheelhouse
        excludes:
          - "**/*.entitlements"
    dependencies:
      - package: WheelhouseKit
        product: WheelhouseKit
      - package: WheelhouseKit
        product: WheelhouseUI
      # - package: SwiftTerm
      #   product: SwiftTerm
      - target: WheelhouseWidgets
        embed: true
      - target: WheelhouseShare
        embed: true
    entitlements:
      path: Wheelhouse/Wheelhouse.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ahmadrezaei.wheelhouse
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.ahmadrezaei.wheelhouse.shared
    info:
      path: Wheelhouse/Info.plist
      properties:
        CFBundleDisplayName: Wheelhouse
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: false
        NSFaceIDUsageDescription: Wheelhouse uses Face ID to unlock the app and to reveal Secret values.
        NSLocalNetworkUsageDescription: Wheelhouse connects to clusters and Prometheus servers on your local network.
        # ATS: user-specified API servers with private CAs on non-local hosts fail ATS's own system trust evaluation, so ATS is
        # relaxed globally. NSAllowsLocalNetworking must NOT be present (iOS ignores NSAllowsArbitraryLoads when it is).
        # Trust is still evaluated strictly in ClusterSessionDelegate (TLSValidator); production clusters refuse http:// in code.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        BGTaskSchedulerPermittedIdentifiers:
          - app.wheelhouse.refresh
        UIBackgroundModes:
          - fetch
        CFBundleURLTypes:
          - CFBundleURLName: com.ahmadrezaei.wheelhouse
            CFBundleURLSchemes:
              - wheelhouse
        CFBundleDocumentTypes:
          - CFBundleTypeName: Kubeconfig
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.yaml
              - com.ahmadrezaei.wheelhouse.kubeconfig
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ahmadrezaei.wheelhouse.kubeconfig
            UTTypeDescription: Kubernetes kubeconfig
            UTTypeConformsTo:
              - public.yaml
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - kubeconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadrezaei.wheelhouse
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  WheelhouseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WheelhouseWidgets
        excludes:
          - "**/*.entitlements"
    dependencies:
      - package: WheelhouseKit
        product: WheelhouseKit
      - package: WheelhouseKit
        product: WheelhouseUI
    entitlements:
      path: WheelhouseWidgets/WheelhouseWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ahmadrezaei.wheelhouse
    info:
      path: WheelhouseWidgets/Info.plist
      properties:
        CFBundleDisplayName: Wheelhouse Widgets
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadrezaei.wheelhouse.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
  WheelhouseShare:
    type: app-extension
    platform: iOS
    sources:
      - path: WheelhouseShare
        excludes:
          - "**/*.entitlements"
    dependencies:
      - package: WheelhouseKit
        product: WheelhouseKit
      - package: WheelhouseKit
        product: WheelhouseUI
    entitlements:
      path: WheelhouseShare/WheelhouseShare.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.ahmadrezaei.wheelhouse.shared
    info:
      path: WheelhouseShare/Info.plist
      properties:
        CFBundleDisplayName: Wheelhouse
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment,
              (ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.data"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text")
              AND NOT (ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audiovisual-content"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf")
              ).@count >= 1).@count >= 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadrezaei.wheelhouse.share
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Wheelhouse:
    build:
      targets:
        Wheelhouse: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: WheelhouseKit/WheelhouseKitTests
    profile:
      config: Release
